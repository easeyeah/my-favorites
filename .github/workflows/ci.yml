name: CI

on:
  push:
    branches: [main]
    tags: ["server-v*", "extension-v*", "web-v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset 门禁要与 base 分支做完整 diff
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 功能改动必须附 changeset
        if: github.event_name == 'pull_request'
        run: pnpm check:changeset
      - name: 提交信息规范（commitlint，PR 全量 / push 多提交）
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT}" = "pull_request" ]; then
            FROM="$(git merge-base "origin/${BASE_REF}" HEAD)"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FROM="${BEFORE}"
          else
            FROM="HEAD~1"
          fi
          echo "commitlint range: ${FROM}..HEAD"
          pnpm commitlint --from "${FROM}" --to HEAD
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mf/extension build
      - run: pnpm --filter @mf/web build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建生产镜像（amd64）
        run: docker build --target prod -t my-favorites:ci -f docker/Dockerfile .
      - name: 内存与体积冒烟（红线 <300MB / <200MB）
        run: |
          docker run -d --name smoke -p 3000:3000 my-favorites:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/healthz && break || sleep 2
          done
          curl -sf http://localhost:3000/healthz
          MEM=$(docker stats --no-stream --format "{{.MemUsage}}" smoke)
          SIZE=$(docker image inspect my-favorites:ci --format '{{.Size}}')
          echo "mem: $MEM, size: $SIZE bytes"
          docker rm -f smoke
