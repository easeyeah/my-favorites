# 本地开发环境（技术方案 §8.1）：服务端一律跑 Docker，开发环境即自建端形态
# 用法：docker compose -f docker/docker-compose.dev.yml up
# name：编排项目名（默认取目录名 docker → 卷/网络会叫 docker_*，显式命名与项目代号一致）
name: my-favorites
services:
  server:
    container_name: my-favorites-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - ../packages:/app/packages
      - ../apps/server:/app/apps/server
      # 管理台静态产物本地构建、容器只托管（此前回退读到 apps/server/web-dist 旧拷贝）
      - ../apps/web/dist:/web-dist:ro
      - server-data:/data
    ports:
      - "3000:3000"
    environment:
      MF_FORM: self-hosted
      MF_ENV: dev # 开发语义：A4-1 安全门槛按 dev 处理（生产语义默认锁定 setup）
      PORT: 3000
      # 管理台/MCP/API 鉴权（dev 本地凭据）：设置后全部 /api/v1 需要 Bearer 令牌
      # （管理台登录页/扩展 options 鉴权用密码换令牌；退出登录=撤销令牌）
      ADMIN_PASSWORD: "123456"
      # 管理台产物指向挂载的本地构建（pnpm --filter @mf/web build 后即时生效）
      WEB_DIST_DIR: /web-dist
      # 数据进命名卷（与 full.yml 一致；不设的话 tsx cwd 在 apps/server，数据会落到宿主机源码目录）
      DATA_DIR: /data
      # LLM 三档切换只改这里：llm-mock -> http://llm-mock:8080/v1
      #                    本机 Ollama -> http://host.docker.internal:11434/v1
      #                    真实端点 -> 厂商 OpenAI 兼容 URL
      LLM_BASE_URL: http://llm-mock:8080/v1
      LLM_API_KEY: mock
  llm-mock:
    container_name: my-favorites-llm-mock
    image: node:22-alpine
    working_dir: /mock
    volumes:
      # 挂目录而非单文件：编辑器/sed 替换文件会更换 inode，单文件挂载会失效
      # 注意：相对路径以本 compose 文件所在目录（docker/）为基准 → 挂自身即 ./:/mock:ro
      - ./:/mock:ro
    command: node /mock/llm-mock.mjs
    ports:
      - "18080:8080"

volumes:
  server-data:
