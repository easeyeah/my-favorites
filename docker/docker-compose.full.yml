# 全离线自建（M3）：自建服务端 + 本机 Ollama，零云依赖
# 用法：docker compose -f docker/docker-compose.full.yml up -d
# 扩展/管理台设置 LLM_BASE_URL 即可全离线运行
# name：编排项目名（默认取目录名 docker → 卷/网络会叫 docker_*，显式命名与项目代号一致）
name: my-favorites
services:
  server:
    container_name: my-favorites-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    ports:
      - "3000:3000"
    environment:
      MF_FORM: self-hosted
      PORT: 3000
      # 全离线：指向容器内 Ollama
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:7b
      LLM_EMBEDDING_MODEL: nomic-embed-text
      # NAS 红线资源限制（可用 docker stats 验证 <300MB）
      MEM_LIMIT: 300m
      # 每周维护任务（死链/查重自动执行）
      MF_MAINTENANCE_INTERVAL_HOURS: 168
      # 数据落盘（SQLite + 快照）
      DATA_DIR: /data
      # DEV-05 生产语义：首启引导凭据（setup 时以 x-mf-setup-token 头携带；
      # 不设置则服务端自动生成并写入 /data/bootstrap-token.txt，权限 600）
      # MF_SETUP_TOKEN: "change-me-to-a-random-string"
      # DEV-05 来源白名单：跨域访问（如自建 NAS 域名 + 浏览器扩展）显式列出 origin，
      # 逗号分隔。管理台同源访问无需配置。
      # MF_ALLOWED_ORIGINS: "chrome-extension://xxxxxxxx,https://nas.example.com"
      # DEV-05 反代后按 X-Forwarded-For 限速（仅当反代可信时开启，默认不信任代理头）
      # MF_TRUST_PROXY: "1"
      # 生产语义必填：Provider API Key 的 AES-256-GCM 落库加密密钥（32 字节 base64）
      # MF_SECRET_KEY: "base64-encoded-32-byte-key"
    volumes:
      - server-data:/data
    depends_on:
      - ollama
  ollama:
    container_name: my-favorites-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # GPU 用户可取消注释以下段落
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
volumes:
  server-data:
  ollama-models:
